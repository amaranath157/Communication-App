name: Django CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. TEST JOB — runs on every push / PR
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # ── Secrets injected from GitHub Repository Secrets ────────────────────
      DJANGO_SECRET_KEY:     ${{ secrets.DJANGO_SECRET_KEY }}
      DEBUG:                 "False"
      ALLOWED_HOSTS:         "localhost,127.0.0.1"
      DATABASE_URL:          ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
      GITHUB_MODELS_TOKEN:   ${{ secrets.GITHUB_MODELS_TOKEN }}
      EMAIL_HOST_USER:       ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD:   ${{ secrets.EMAIL_HOST_PASSWORD }}
      REDIS_HOST:            "127.0.0.1"
      REDIS_PORT:            "6379"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check --deploy

      - name: Run migrations (dry-run)
        run: python manage.py migrate --run-syncdb --check || true

      - name: Run tests
        run: python manage.py test --verbosity=2

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. DEPLOY JOB — runs only on push to main/master after tests pass
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    env:
      # ── Same secrets as the test job ───────────────────────────────────────
      DJANGO_SECRET_KEY:     ${{ secrets.DJANGO_SECRET_KEY }}
      DEBUG:                 "False"
      DATABASE_URL:          ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
      GITHUB_MODELS_TOKEN:   ${{ secrets.GITHUB_MODELS_TOKEN }}
      EMAIL_HOST_USER:       ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD:   ${{ secrets.EMAIL_HOST_PASSWORD }}
      REDIS_HOST:            ${{ secrets.REDIS_HOST }}
      REDIS_PORT:            ${{ secrets.REDIS_PORT }}
      ALLOWED_HOSTS:         ${{ secrets.ALLOWED_HOSTS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      # ── Add your deployment step below (Railway / Render / VPS / etc.) ─────
      # Example: Deploy to Railway
      # - name: Deploy to Railway
      #   run: railway up
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Example: SSH deploy to VPS
      # - name: SSH Deploy
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host:     ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key:      ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd /var/www/backend
      #       git pull
      #       source venv/bin/activate
      #       pip install -r requirements.txt
      #       python manage.py migrate --noinput
      #       sudo systemctl restart gunicorn

      - name: Deployment complete
        run: echo "✅ Deployment finished successfully."
